# Hosted Docker topology. All app services use ordinary private Docker DNS.
services:
  app:
    ports: !reset []
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN to the API hostname}
      APP_CONTAINER_PORT: ${API_CONTAINER_PORT:-8080}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
