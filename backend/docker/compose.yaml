x-service-defaults: &service-defaults
  restart: unless-stopped

services:
  app:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${API_CONTAINER_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-app}
      DATABASE_USER: ${POSTGRES_USER:-app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-app}
      MIGRATIONS_DIR: /app/migrations
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ../services/database/migrations:/app/migrations:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:${API_CONTAINER_PORT:-8080}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    stop_grace_period: 15s

  postgres:
    image: ${POSTGRES_IMAGE:-jlabrada/postgis-pgvector:0.1.0}
    <<: *service-defaults
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../services/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
